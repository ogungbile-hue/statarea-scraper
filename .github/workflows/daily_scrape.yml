name: Onítẹ́tẹ́ Daily Midnight Scraper & Slip Generator

on:
  schedule:
    # Runs everyday at 00:00 UTC (12:00 AM Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-update:
    name: Crawl Statarea & Rebuild Daily Slips
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Settle Yesterday Scores & Update Ledger
        run: |
          python main.py --update-scores || echo "Score settlement warning (continuing)"

      - name: Run Full Scraper & Generate 1.5x / 3x / 5x / 10x Slips
        run: |
          python main.py

      - name: Commit and Push Updated Analytical Datasets & Slips
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No data changes detected to commit."
          else
            git commit -m "chore(data): auto-update daily predictions & ledger [skip ci]"
            git push
          fi
